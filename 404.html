<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10110F">
  <title>Page Not Found — Saransh Gupta</title>
  <meta name="description" content="The page you are looking for could not be found.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <style>
    .not-found {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 6%;
      text-align: center;
    }
    .not-found-inner { max-width: 620px; }
    .not-found-code {
      color: #C5F467;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 3px;
      margin-bottom: 20px;
    }
    .not-found h1 {
      font-family: "Barlow Condensed", sans-serif;
      font-size: clamp(76px, 16vw, 150px);
      line-height: .8;
      letter-spacing: -2px;
      margin: 0;
    }
    .not-found h1 em { color: #C5F467; font-style: normal; }
    .not-found p {
      color: #92958A;
      max-width: 430px;
      margin: 28px auto 34px;
      font-size: 13px;
      line-height: 1.8;
    }
    .not-found a {
      display: inline-flex;
      align-items: center;
      min-height: 46px;
      padding: 0 22px;
      background: #C5F467;
      color: #10110F;
      text-decoration: none;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.4px;
    }
    .not-found a:hover { transform: translateY(-2px); }
  </style>
</head>
<body id="top">
  <main class="not-found">
    <div class="not-found-inner">
      <div class="not-found-code">404 / PAGE NOT FOUND</div>
      <h1>WRONG<br><em>FRAME.</em></h1>
      <p>The page you're looking for doesn't exist or may have moved. Let's get you back to the portfolio.</p>
      <a href="/">BACK TO PORTFOLIO ↗</a>
    </div>
  </main>
</body>
</html>
